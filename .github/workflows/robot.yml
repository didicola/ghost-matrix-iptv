name: Ghost Matrix Robot

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      
      - name: Quality-First Full Internet Scan
        run: |
          python3 << 'PYEOF'
          import hashlib, urllib.request, json
          from concurrent.futures import ThreadPoolExecutor, as_completed

          def fetch(url, timeout=30):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'GhostMatrix/4.0'})
                  return urllib.request.urlopen(req, timeout=timeout).read().decode('utf-8', errors='ignore')
              except:
                  return None

          # ============ QUALITY SOURCES (official FAST channels) ============
          # These are legal, ad-supported, reliable: Pluto, Samsung TV Plus,
          # Xumo, LG Channels, Redbox, Roku, Vizio, Free-TV curated list.
          QUALITY_SOURCES = [
              'https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8',
              'https://www.apsattv.com/xumo.m3u',
              'https://apsattv.com/ssungusa.m3u',
              'https://www.apsattv.com/lg.m3u',
              'https://www.apsattv.com/rok.m3u',
              'https://www.apsattv.com/redbox.m3u',
              'https://www.apsattv.com/distro.m3u',
              'https://www.apsattv.com/xiaomi.m3u',
              'https://www.apsattv.com/tablo.m3u',
              'https://www.apsattv.com/vizio.m3u',
              'https://www.apsattv.com/localnow.m3u',
              'https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/ipv6.m3u',
              'https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/ipv4.m3u',
          ]

          # Secondary: iptv-org (tested, no geo-blocked)
          BASE = 'https://iptv-org.github.io/iptv'
          def get_codes(url):
              d = fetch(url)
              if not d: return []
              try:
                  return [c.get('code','').lower() for c in json.loads(d) if c.get('code')]
              except:
                  return []

          countries = get_codes('https://iptv-org.github.io/api/countries.json')
          IO_SOURCES = [f'{BASE}/index.m3u']
          IO_SOURCES += [f'{BASE}/categories/c.m3u' for c in
                         ['entertainment','movies','series','sports','news','kids','music','documentary']]
          IO_SOURCES += [f'{BASE}/countries/{c}.m3u' for c in countries]

          ALL_SOURCES = QUALITY_SOURCES + IO_SOURCES
          print(f'Scanning {len(ALL_SOURCES)} sources (quality-first)', flush=True)

          def parse_m3u(data):
              channels = {}
              lines = data.split('\n')
              i = 0
              while i < len(lines):
                  if lines[i].startswith('#EXTINF'):
                      extinf = lines[i]
                      url = lines[i+1].strip() if i+1 < len(lines) else ''
                      if url.startswith('http'):
                          # SKIP geo-blocked channels (useless internationally)
                          if '[Geo-blocked]' in extinf or 'geo-block' in extinf.lower():
                              i += 2
                              continue
                          ch_id = hashlib.md5(url.encode()).hexdigest()[:12]
                          name = extinf.split(',')[-1].strip()
                          group = 'General'
                          if 'group-title="' in extinf:
                              s = extinf.find('group-title="') + 13
                              e = extinf.find('"', s)
                              group = extinf[s:e]
                          channels[ch_id] = {'name': name, 'group': group, 'url': url}
                      i += 2
                  else:
                      i += 1
              return channels

          all_channels = {}
          with ThreadPoolExecutor(max_workers=12) as ex:
              futures = {ex.submit(fetch, src): src for src in ALL_SOURCES}
              for fut in as_completed(futures):
                  data = fut.result()
                  if data:
                      try:
                          all_channels.update(parse_m3u(data))
                      except:
                          pass

          print(f'Discovered {len(all_channels)} unique channels', flush=True)

          def test_stream(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  data = urllib.request.urlopen(req, timeout=6).read(4096)
                  return len(data) > 50
              except:
                  return False

          print('Testing all channels (parallel)...', flush=True)
          working = {}
          total = len(all_channels)
          with ThreadPoolExecutor(max_workers=80) as ex:
              futures = {ex.submit(test_stream, ch['url']): cid for cid, ch in all_channels.items()}
              done = 0
              for fut in as_completed(futures):
                  done += 1
                  cid = futures[fut]
                  if fut.result():
                      working[cid] = all_channels[cid]
                  if done % 3000 == 0:
                      print(f'  {done}/{total} tested -> {len(working)} working', flush=True)

          print(f'WORKING: {len(working)}/{total}', flush=True)

          # Prioritize quality sources at top (official FAST channels)
          def is_quality(url):
              q = ['fe.tring.al','apsattv','dai.google.com','cloudfront.net','nagra','fubo','pluto',
                   'iptv-org','fanmingming','hikvision','newtv','youtube.com/live','tele.cdn']
              return any(x in url for x in q)

          groups = {}
          for cid, ch in working.items():
              g = ch.get('group', 'General') or 'General'
              groups.setdefault(g, []).append(ch)

          content = '#EXTM3U\n'
          count = 0
          # Quality-first ordering: put Official FAST + curated channels first
          ordered = sorted(groups.keys(), key=lambda g: 0 if is_quality(groups[g][0]['url']) else 1)
          for g in ordered:
              chans = sorted(groups[g], key=lambda x: x['name'].lower())
              # Prefer the best single stream per channel name
              seen = {}
              for ch in chans:
                  key = ch['name'].lower()
                  seen.setdefault(key, ch)
              for name, ch in sorted(seen.items()):
                  content += f'#EXTINF:-1 group-title="{g}",{ch["name"]}\n{ch["url"]}\n'
                  count += 1

          with open('iptv.m3u', 'w') as f:
              f.write(content)

          print(f'Ghost Matrix generated {count} working channels', flush=True)
          PYEOF
      

      - name: Dedupe (best source per channel)
        run: |
          python3 << 'PYEOF'
          import re
          src = open('iptv.m3u', errors='ignore').read().split('\n')
          def host_rank(url):
              rank = 50
              if 'dai.google.com' in url: rank = 100
              elif 'cloudfront.net' in url: rank = 95
              elif 'samsung' in url: rank = 90
              elif 'pluto' in url: rank = 85
              elif 'nagra' in url or 'fubo' in url: rank = 80
              if url.startswith('https'): rank += 5
              if '[' in url: rank -= 40
              return rank
          chans = {}
          i = 0
          while i < len(src):
              if src[i].startswith('#EXTINF'):
                  url = src[i+1].strip() if i+1 < len(src) else ''
                  if url.startswith('http'):
                      ext = src[i]
                      name = ext.split(',')[-1].strip().lower()
                      name = re.sub(r'\s*\([^)]*\)\s*$','',name).strip()
                      if name not in chans or host_rank(url) > chans[name][2]:
                          chans[name] = (ext, url, host_rank(url))
                  i += 2
              else:
                  i += 1
          out = ['#EXTM3U']
          for name,(ext,url,rank) in sorted(chans.items()):
              out.append(ext); out.append(url)
          open('iptv.m3u','w').write('\n'.join(out)+'\n')
          print(f'Deduped to {len(chans)} channels')
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "Ghost Matrix Robot"
          git config user.email "robot@ghostmatrix.ai"
          git add iptv.m3u
          git diff --cached --quiet || git commit -m "Robot update: $(grep -c '^#EXTINF' iptv.m3u) working channels"
          git push
          git tag -f live
          git push -f origin live
          echo "Published @live"