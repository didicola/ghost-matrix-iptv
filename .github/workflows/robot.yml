name: Ghost Matrix Robot

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours - auto scan full internet
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Ghost Matrix Robot (Full Internet + Satellite + P2P Scan)
        run: |
          python3 << 'PYEOF'
          import hashlib
          import urllib.request
          import json
          from concurrent.futures import ThreadPoolExecutor, as_completed
          
          # === GHOST MATRIX: SCAN ENTIRE INTERNET ===
          # - iptv-org: ALL countries + ALL languages + ALL categories (dynamic)
          # - Satellite aggregator playlists (all countries)
          # - P2P / AceStream / community M3U indexes
          # - Extra public IPTV indexes
          
          BASE = 'https://iptv-org.github.io/iptv'
          
          CATEGORIES = ['entertainment','movies','series','sports','news','kids',
                        'music','documentary','comedy','animation','educational',
                        'general','lifestyle','travel','game','governmental',
                        'religion','science','technology','weather','auto',
                        'business','crypto','culture','food','gaming','history',
                        'nature','other','anime','balkan','book','classic',
                        'collectibles','cooking','dance','desi','devotional',
                        'discovery','diy','drama','economics','fashion','films',
                        'finance','fitness','uk','us','xxx']
          
          def fetch(url, timeout=30):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'GhostMatrix/3.0'})
                  resp = urllib.request.urlopen(req, timeout=timeout)
                  return resp.read().decode('utf-8', errors='ignore')
              except:
                  return None
          
          # Dynamically fetch ALL countries and languages from iptv-org API
          print('Fetching full country + language list from iptv-org...')
          countries = []
          languages = []
          api_data = fetch('https://iptv-org.github.io/api/countries.json')
          if api_data:
              try:
                  for c in json.loads(api_data):
                      if c.get('code'): countries.append(c['code'].lower())
              except: pass
          lang_data = fetch('https://iptv-org.github.io/api/languages.json')
          if lang_data:
              try:
                  for l in json.loads(lang_data):
                      if l.get('code'): languages.append(l['code'].lower())
              except: pass
          print(f'Countries: {len(countries)} | Languages: {len(languages)}')
          
          SOURCES = [f'{BASE}/index.m3u']
          SOURCES += [f'{BASE}/categories/{c}.m3u' for c in CATEGORIES]
          for c in countries:
              SOURCES.append(f'{BASE}/countries/{c}.m3u')
          for l in languages:
              SOURCES.append(f'{BASE}/languages/{l}.m3u')
          
          # === SATELLITE + P2P + COMMUNITY AGGREGATORS (entire internet) ===
          EXTRA = [
              # Community / aggregator M3Us (satellite + internet)
              'https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u',
              'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/unsorted.m3u',
              'https://raw.githubusercontent.com/matthuisman/i.mjh.nz/master/IPTV/All.m3u',
              'https://iptv-org.github.io/epg/guide.xml',
              # Satellite-focused indexes
              'https://raw.githubusercontent.com/kaotickj/iptv/master/iptv.m3u',
              'https://raw.githubusercontent.com/vamos-rodar/iptv/master/playlist.m3u',
              'https://raw.githubusercontent.com/freearhey/iptv/master/index.m3u',
              # P2P / AceStream community M3U indexes
              'https://raw.githubusercontent.com/peuj/aceproxy/master/playlist.m3u',
              'https://raw.githubusercontent.com/Stalker-E2/iptv/master/playlist.m3u',
              'https://raw.githubusercontent.com/king2369/iptv/master/playlist.m3u',
              'https://raw.githubusercontent.com/live-tv-channels/iptv/master/playlist.m3u',
              'https://raw.githubusercontent.com/imdhmd/ipTV/master/playlist.m3u',
              'https://raw.githubusercontent.com/benmoose39/42-iptv/master/playlist.m3u',
              'https://raw.githubusercontent.com/DeepHorizons/iptv/master/playlist.m3u',
              'https://raw.githubusercontent.com/HtmlBuilder24/iptv/master/playlist.m3u',
              'https://raw.githubusercontent.com/AshGw/iptv/master/playlist.m3u',
              'https://raw.githubusercontent.com/yaoxin1213/IPTV/master/playlist.m3u',
              'https://raw.githubusercontent.com/Phuka97/IPTV/master/playlist.m3u',
              'https://raw.githubusercontent.com/MrBot2021/iptv/master/playlist.m3u',
          ]
          SOURCES += EXTRA
          
          print(f'Ghost Matrix scanning {len(SOURCES)} sources from entire internet...')
          
          def parse_m3u(data):
              channels = {}
              lines = data.split('\n')
              i = 0
              while i < len(lines):
                  if lines[i].startswith('#EXTINF'):
                      extinf = lines[i]
                      url = lines[i+1].strip() if i+1 < len(lines) else ''
                      if url.startswith('http') or url.startswith('acestream://') or url.startswith('p2p://'):
                          ch_id = hashlib.md5(url.encode()).hexdigest()[:12]
                          name = extinf.split(',')[-1].strip() if ',' in extinf else 'Unknown'
                          group = 'General'
                          if 'group-title="' in extinf:
                              s = extinf.find('group-title="') + 13
                              e = extinf.find('"', s)
                              group = extinf[s:e]
                          channels[ch_id] = {'name': name, 'group': group, 'url': url, 'extinf': extinf}
                      i += 2
                  else:
                      i += 1
              return channels
          
          all_channels = {}
          with ThreadPoolExecutor(max_workers=15) as ex:
              futures = {ex.submit(fetch, src): src for src in SOURCES}
              for fut in as_completed(futures):
                  data = fut.result()
                  if data:
                      try:
                          chs = parse_m3u(data)
                          all_channels.update(chs)
                      except:
                          pass
          
          print(f'Discovered {len(all_channels)} unique channels across internet')
          
          def test_stream(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Kodi/21.2)'})
                  resp = urllib.request.urlopen(req, timeout=8)
                  data = resp.read(4096)
                  return len(data) > 100
              except:
                  return False
          
          print('Testing all channels in parallel (50 threads)...')
          working = {}
          with ThreadPoolExecutor(max_workers=50) as ex:
              futures = {ex.submit(test_stream, ch['url']): cid for cid, ch in all_channels.items()}
              done = 0
              for fut in as_completed(futures):
                  done += 1
                  cid = futures[fut]
                  if fut.result():
                      working[cid] = all_channels[cid]
                  if done % 2000 == 0:
                      print(f'  tested {done}/{len(all_channels)} -> {len(working)} working')
          
          print(f'Working channels: {len(working)}')
          
          groups = {}
          for cid, ch in working.items():
              g = ch.get('group', 'General') or 'General'
              groups.setdefault(g, []).append(ch)
          
          content = '#EXTM3U\n'
          for g in sorted(groups.keys()):
              for ch in sorted(groups[g], key=lambda x: x['name'].lower()):
                  content += ch['extinf'] + '\n' + ch['url'] + '\n'
          
          with open('iptv.m3u', 'w') as f:
              f.write(content)
          
          print(f'Ghost Matrix generated {len(working)} working channels')
          PYEOF
      
      - name: Commit and push
        run: |
          git config user.name "Ghost Matrix Robot"
          git config user.email "robot@ghostmatrix.ai"
          git add iptv.m3u
          git diff --cached --quiet || git commit -m "Robot update: $(grep -c '^#EXTINF' iptv.m3u) working channels"
          git push
