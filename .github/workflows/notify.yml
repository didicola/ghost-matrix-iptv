name: Ghost Matrix Notifications

on:
  schedule:
    - cron: '0 */12 * * *'  # Every 12 hours
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for broken channels
        run: |
          python3 << 'PYEOF'
          import hashlib
          import urllib.request
          import json
          import os
          
          # Load current M3U
          try:
              with open('iptv.m3u') as f:
                  content = f.read()
          except:
              print("No M3U found")
              exit(0)
          
          # Parse channels
          channels = {}
          lines = content.split('\n')
          i = 0
          while i < len(lines):
              if lines[i].startswith('#EXTINF'):
                  extinf = lines[i]
                  url = lines[i+1] if i+1 < len(lines) else ''
                  if url.startswith('http'):
                      ch_id = hashlib.md5(url.encode()).hexdigest()[:12]
                      name = extinf.split(',')[-1] if ',' in extinf else 'Unknown'
                      channels[ch_id] = {'name': name, 'url': url}
                  i += 2
              else:
                  i += 1
          
          print(f'Checking {len(channels)} channels...')
          
          # Test channels
          broken = []
          working = 0
          
          def test_stream(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  resp = urllib.request.urlopen(req, timeout=8)
                  data = resp.read(2048)
                  return len(data) > 100
              except:
                  return False
          
          for ch_id, ch in list(channels.items())[:100]:  # Test first 100
              if test_stream(ch['url']):
                  working += 1
              else:
                  broken.append(ch['name'])
          
          print(f'Working: {working}/100')
          print(f'Broken: {len(broken)}')
          
          if broken:
              print('\nBroken channels:')
              for name in broken[:10]:
                  print(f'  - {name}')
              
              # Save report
              report = {
                  'total': len(channels),
                  'working': working,
                  'broken': len(broken),
                  'broken_channels': broken[:20]
              }
              
              with open('report.json', 'w') as f:
                  json.dump(report, f, indent=2)
              
              print('\nReport saved to report.json')
          else:
              print('\nAll channels working!')
          PYEOF
      
      - name: Create issue if broken
        if: hashFiles('report.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('report.json', 'utf8'));
            
            if (report.broken > 0) {
              const body = `## Ghost Matrix Robot Report\n\n` +
                `- Total channels: ${report.total}\n` +
                `- Working: ${report.working}\n` +
                `- Broken: ${report.broken}\n\n` +
                `### Broken Channels\n` +
                report.broken_channels.map(name => `- ${name}`).join('\n') +
                `\n\n---\n*Auto-generated by Ghost Matrix Robot*`;
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Ghost Matrix: ${report.broken} broken channels detected`,
                body: body,
                labels: ['robot-report']
              });
              
              console.log('Issue created!');
            }
